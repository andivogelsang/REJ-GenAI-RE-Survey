[project]
name = "genai-re-survey"
version = "0.1.0"
description = "Analysis package for the GenAI-in-RE practitioner survey (REFSQ 2026 + journal extension)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas",
    "matplotlib",
    "seaborn",
    "scipy",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipykernel",
]
dev = [
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_re_survey"]
